server {
    listen 80;
    server_name _;

    # Acompanha o limite de upload do app (multipart 30MB)
    client_max_body_size 30m;

    # Headers de seguranca basicos. NAO substituem TLS: este arquivo so
    # termina HTTP puro (porta 80) - o sistema lida com dados de paciente
    # (nome, RGCT), entao configure HTTPS (certbot/Let's Encrypt ou um
    # proxy/CDN na frente com TLS) antes de expor a porta 80 publicamente.
    # Ver deploy/README-deploy.md.
    #
    # X-Frame-Options NAO e definido aqui de proposito: a propria aplicacao
    # Spring (SecurityConfig) ja emite esse header em producao (DENY por
    # padrao, SAMEORIGIN so na rota especifica do PDF do avaliador) - definir
    # aqui TAMBEM faria o cliente receber dois valores conflitantes.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # 8080 aqui depende de SERVER_PORT=8080 estar definido em sgpur.env
        # (deploy/sgpur.env.example ja traz esse valor). O default da propria
        # aplicacao (application.yml, sem SERVER_PORT) e a porta 3000 - se
        # sgpur.env algum dia deixar de definir SERVER_PORT, o app sobe na
        # 3000 e este proxy_pass passa a devolver 502.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
