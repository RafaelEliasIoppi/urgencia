<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${edicao} ? 'Editar usuário' : 'Novo usuário'">Usuário</h1>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:object="${usuario}" method="post"
          th:action="${edicao} ? @{/usuarios/{id}/editar(id=${usuario.id})} : @{/usuarios}"
          class="card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" th:for="username">Login *</label>
                <input type="text" th:field="*{username}" class="form-control" required th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('username')} ? 'true' : null,aria-describedby=${#fields.hasErrors('username')} ? 'usernameErro' : null">
                <div class="invalid-feedback d-block" id="usernameErro" role="alert" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:for="nome">Nome *</label>
                <input type="text" th:field="*{nome}" class="form-control" required th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('nome')} ? 'true' : null,aria-describedby=${#fields.hasErrors('nome')} ? 'nomeErro' : null">
                <div class="invalid-feedback d-block" id="nomeErro" role="alert" th:errors="*{nome}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:for="email">E-mail *</label>
                <input type="email" th:field="*{email}" class="form-control" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : null,aria-describedby=${#fields.hasErrors('email')} ? 'emailErro' : null">
                <div class="invalid-feedback d-block" id="emailErro" role="alert" th:errors="*{email}"></div>
                <div class="form-text text-muted">
                    Usado para enviar a nova senha em "Esqueci minha senha".
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="perfilSelect">Perfil *</label>
                <select th:field="*{perfil}" class="form-select" id="perfilSelect">
                    <option th:each="pf : ${perfis}" th:value="${pf.name()}" th:text="${pf.descricao}"></option>
                </select>
            </div>

            <!-- Membro vinculado: visivel e obrigatorio apenas para perfil AVALIADOR -->
            <div class="mb-3" id="membroBox">
                <label class="form-label" for="membroSelect">Membro da Urgência Renal vinculado *</label>
                <select name="membroId" class="form-select" id="membroSelect">
                    <option value="">-- selecione o médico avaliador --</option>
                    <option th:each="m : ${membros}"
                            th:value="${m.id}"
                            th:text="${m.rotulo}"
                            th:selected="${usuario.membro != null and usuario.membro.id == m.id}"></option>
                </select>
                <div class="form-text text-muted">
                    Identifica qual médico este login representa no Portal do Avaliador (/avaliador).
                </div>
            </div>

            <!-- Equipe solicitante: visivel e obrigatoria apenas para perfil SOLICITANTE -->
            <div class="mb-3" id="equipeSolicitanteBox">
                <label class="form-label" for="equipeSolicitanteInput">Equipe / hospital solicitante *</label>
                <input type="text" name="equipeSolicitante" class="form-control" id="equipeSolicitanteInput"
                       th:value="${usuario.equipeSolicitante}" maxlength="200">
                <div class="form-text text-muted">
                    Pre-preenche o formulario de nova solicitação online (/solicitante/nova) deste usuário.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" th:text="${edicao} ? 'Nova senha (deixe vazio para manter)' : 'Senha *'" for="senhaForm">Senha</label>
                <div class="input-group">
                    <input type="password" name="senha" class="form-control" id="senhaForm" autocomplete="new-password"
                           th:required="${!edicao}"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                           th:attr="aria-invalid=${#fields.hasErrors('senha')} ? 'true' : null,
                                    aria-describedby=${#fields.hasErrors('senha')} ? 'senhaErro' : null">
                    <button class="btn btn-outline-secondary" type="button" id="olhoSenhaForm"
                            data-alvo-senha="senhaForm"
                            title="Mostrar/ocultar senha" aria-label="Mostrar/ocultar senha">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback d-block" id="senhaErro" role="alert" th:errors="*{senha}"></div>
            </div>
            <div class="form-check">
                <input type="checkbox" th:field="*{ativo}" class="form-check-input" id="ativo">
                <label class="form-check-label" for="ativo">Ativo</label>
            </div>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</main>

<script th:replace="~{layout :: scripts}"></script>
<script>
(function () {
    var perfilSelect = document.getElementById('perfilSelect');
    var membroBox = document.getElementById('membroBox');
    var membroSelect = document.getElementById('membroSelect');
    var equipeSolicitanteBox = document.getElementById('equipeSolicitanteBox');
    var equipeSolicitanteInput = document.getElementById('equipeSolicitanteInput');

    function atualizarMembro() {
        var ehAvaliador = perfilSelect.value === 'AVALIADOR';
        membroBox.style.display = ehAvaliador ? '' : 'none';
        membroSelect.required = ehAvaliador;

        var ehSolicitante = perfilSelect.value === 'SOLICITANTE';
        equipeSolicitanteBox.style.display = ehSolicitante ? '' : 'none';
        equipeSolicitanteInput.required = ehSolicitante;
    }

    perfilSelect.addEventListener('change', atualizarMembro);
    atualizarMembro();
})();
</script>
<script th:src="@{/js/mostrar-senha.js}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
