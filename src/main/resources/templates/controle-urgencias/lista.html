<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Controle de Urgências')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">
            <i class="bi bi-clock-history me-2"></i>Urgências para Transplante Renal
        </h1>
        <a th:href="@{/controle-urgencias/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo registro
        </a>
    </div>

    <!-- Cards de resumo: mesmo componente .stat-card do Painel e do Portal do
         Solicitante (unificado em 2026-08-04). Antes esta tela usava um padrao
         proprio - card border-* com um badge fs-5 dentro -, e Membros usava um
         terceiro; o sistema tinha 4 dialetos visuais para "cartao de numero". -->
    <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">
        <div class="col">
            <div class="stat-card stat-card-portal stat-card-membros stat-card-estatico h-100">
                <div class="d-flex align-items-center justify-content-between">
                    <span class="stat-number" th:text="${ativas}">0</span>
                    <span class="stat-icon"><i class="bi bi-play-circle"></i></span>
                </div>
                <div class="stat-label">Ativas</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card stat-card-portal stat-card-deferido stat-card-estatico h-100">
                <div class="d-flex align-items-center justify-content-between">
                    <span class="stat-number" th:text="${renovadas}">0</span>
                    <span class="stat-icon"><i class="bi bi-arrow-clockwise"></i></span>
                </div>
                <div class="stat-label">Renovadas</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card stat-card-portal stat-card-andamento stat-card-estatico h-100">
                <div class="d-flex align-items-center justify-content-between">
                    <span class="stat-number" th:text="${expiradas}">0</span>
                    <span class="stat-icon"><i class="bi bi-hourglass-bottom"></i></span>
                </div>
                <div class="stat-label">Expiradas</div>
            </div>
        </div>
        <div class="col">
            <div class="stat-card stat-card-portal stat-card-cancelado stat-card-estatico h-100">
                <div class="d-flex align-items-center justify-content-between">
                    <span class="stat-number" th:text="${canceladas}">0</span>
                    <span class="stat-icon"><i class="bi bi-slash-circle"></i></span>
                </div>
                <div class="stat-label">Canceladas</div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form method="get" th:action="@{/controle-urgencias}" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label small fw-semibold text-muted mb-1" for="q">Busca</label>
                    <input type="text" name="q" class="form-control form-control-sm" th:value="${q}"
                           placeholder="Paciente, RGCT ou equipe..." id="q" data-busca-atalho>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/controle-urgencias}" class="btn btn-outline-secondary btn-sm"
                       title="Limpar filtro" aria-label="Limpar filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th class="d-none d-md-table-cell">RGCT</th>
                        <th>Equipe</th>
                        <th class="d-none d-md-table-cell">ABO</th>
                        <th>Vencimento</th>
                        <th class="d-none d-md-table-cell">Última renovação</th>
                        <th>Situação</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${registros}">
                        <td th:text="${r.nomePaciente}">Paciente</td>
                        <td class="small text-muted d-none d-md-table-cell" th:text="${r.rgct} ?: '-'">RGCT</td>
                        <td class="small" th:text="${r.equipe} ?: '-'">Equipe</td>
                        <td class="d-none d-md-table-cell">
                            <span th:if="${r.abo}" class="badge bg-light text-dark border"
                                  th:text="${r.abo}">AB</span>
                            <span th:unless="${r.abo}">-</span>
                        </td>
                        <td th:text="${#temporals.format(r.dataVencimento, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td class="small text-muted d-none d-md-table-cell" th:text="${r.dataUltimaRenovacao != null} ? ${#temporals.format(r.dataUltimaRenovacao, 'dd/MM/yyyy')} : '-'">-</td>
                        <td>
                            <!-- Classe do badge por situacao via th:switch, em vez de ternarios
                                 aninhados em th:classappend (regra do CLAUDE.md contra ternario
                                 aninhado > 3 niveis). -->
                            <th:block th:switch="${r.situacao.name()}">
                                <span th:case="'ATIVA'" class="badge bg-primary" th:text="${r.situacao.descricao}">Ativa</span>
                                <span th:case="'RENOVADA'" class="badge bg-success" th:text="${r.situacao.descricao}">Ativa</span>
                                <span th:case="'EXPIRADA'" class="badge bg-warning text-dark" th:text="${r.situacao.descricao}">Ativa</span>
                                <span th:case="*" class="badge bg-secondary" th:text="${r.situacao.descricao}">Ativa</span>
                            </th:block>
                            <span th:if="${r.situacao.name() == 'ATIVA' and r.dataVencimento lt hoje}"
                                  class="badge bg-danger ms-1">Vencida</span>
                        </td>
                        <td class="text-end">
                            <!-- Relatorio de clareza (2026-08-05), item 5.4: Editar/Cancelar so
                                 icone (coluna estreita, tabela com 8 colunas), Renovar com texto
                                 por ser a acao mais frequente desta tela - decisao EXPLICITA
                                 (antes os 3 dialetos coexistiam por acaso, nao por escolha). -->
                            <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-1">
                                <a th:href="@{/controle-urgencias/{id}/editar(id=${r.id})}"
                                   class="btn btn-sm btn-outline-secondary" title="Editar" aria-label="Editar urgência">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${r.situacao.name() == 'ATIVA' or r.situacao.name() == 'RENOVADA'}"
                                      th:action="@{/controle-urgencias/{id}/renovar(id=${r.id})}"
                                      method="post"
                                      data-confirm-msg="Renovar esta urgência por mais 30 dias?">
                                    <button class="btn btn-sm btn-outline-success w-100" title="Renovar por mais 30 dias">
                                        <i class="bi bi-arrow-clockwise"></i> Renovar
                                    </button>
                                </form>
                                <form th:if="${r.situacao.name() == 'ATIVA' or r.situacao.name() == 'RENOVADA'}"
                                      th:action="@{/controle-urgencias/{id}/cancelar(id=${r.id})}"
                                      method="post"
                                      data-confirm-msg="Cancelar esta urgência?">
                                    <button class="btn btn-sm btn-outline-danger w-100" title="Cancelar" aria-label="Cancelar urgência">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${registros.isEmpty()}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-inbox d-block mb-1" style="font-size:2rem;opacity:.5;"></i>
                        Nenhum registro de urgência cadastrado.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: confirmModal}"></div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: confirmarAcaoScript}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
